[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "4.13.2"
kxml2 = "2.3.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
# M3 Expressive API（MaterialExpressiveTheme/MotionScheme 等）自 1.5.0 起公开，需覆盖 BOM 版本。
# compose-bom 2026.09.00 也只给到 1.4.0，而 1.5.0 尚无稳定版（最新即 alpha28），
# 所以这行必须继续钉住；等 1.5.0 稳定版发布后可删掉它，改由 BOM 管理。
material3 = "1.5.0-alpha28"
# 折叠屏感知与自适应布局
window = "1.5.0"
adaptive = "1.3.0"
# 架构组件
lifecycleViewmodelCompose = "2.11.0"
navigationCompose = "2.10.1"
coroutines = "1.11.0"
# 本地存储
datastore = "1.2.0"
json = "20260814"
room = "2.8.5"
ksp = "2.3.12"
# 漫画容器读取：commons-compress 覆盖 zip/tar/7z，junrar 覆盖 rar
commonsCompress = "1.28.0"
# 7z 的 LZMA/LZMA2 解码由 xz 提供（commons-compress 把它声明为可选依赖，
# 但不加它真实 .7z 一律解不开）
xz = "1.12"
junrar = "8.1.1"
# PDF：androidx.pdf 负责渲染（只取 pdf-core + pdf-document-service，不引成品 UI），
# PdfBox 负责元数据/目录/页码标签/文本提取
androidxPdf = "1.0.0-beta01"
pdfboxAndroid = "2.0.27.0"
# JVM 单测里的 Android API（Paint / BitmapFactory / SQLite / Compose UI）
robolectric = "4.17"
# 桌面清理工具（tools/cleaner）用的 Compose Multiplatform；与 kotlin 版本需配套
composeMultiplatform = "1.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# 折叠屏感知与自适应布局
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "adaptive" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# 架构组件
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# 本地存储
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
org-json = { group = "org.json", name = "json", version.ref = "json" }
# 漫画容器读取
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
# PDF 渲染与解析
androidx-pdf-core = { group = "androidx.pdf", name = "pdf-core", version.ref = "androidxPdf" }
androidx-pdf-document-service = { group = "androidx.pdf", name = "pdf-document-service", version.ref = "androidxPdf" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
