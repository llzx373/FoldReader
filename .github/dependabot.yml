version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      google:
        patterns:
          - "com.google.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          # Compose Multiplatform 的 Gradle 插件与 Kotlin 编译器版本强绑定，
          # 必须同一批提，否则会出现「Kotlin 升了、CMP 没升」的错配。
          - "org.jetbrains.compose*"
      archive:
        patterns:
          - "org.apache.commons:*"
          - "org.tukaani:*"
          - "com.github.junrar:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
