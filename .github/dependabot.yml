version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      google:
        patterns:
          - "com.google.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      archive:
        patterns:
          - "org.apache.commons:*"
          - "org.tukaani:*"
          - "com.github.junrar:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
