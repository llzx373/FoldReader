name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看一眼 [需求与设计说明书](https://github.com/llzx373/FoldReader/blob/main/docs/需求与设计说明书.md)
        与 [TODO.md](https://github.com/llzx373/FoldReader/blob/main/TODO.md)——
        有些功能是**明确不做**的（在线书城、账号与云同步、OCR、社交），提了也不会有结果。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？先讲问题，再讲方案
      placeholder: "我在看长篇连载时，经常需要……目前只能……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望应用怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你目前是怎么绕过的
      description: 已知的其他做法、其他阅读器的处理方式等
    validations:
      required: false

  - type: dropdown
    id: foldable-related
    attributes:
      label: 是否与折叠屏形态相关
      options:
        - 是（涉及双页书模式 / 桌面模式 / 铰链避让）
        - 否（与形态无关的通用功能）
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提 PR 实现这个功能
          required: false
